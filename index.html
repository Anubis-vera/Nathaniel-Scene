<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Other Scenes With Nathaniel</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap");

:root {
color-scheme: dark;
--ink: #080808;
--panel: #111111;
--crimson: #8b0000;
--red: #a0252f;
--gold: #b8860b;
--light-gold: #d4a574;
--text: #e2e2e2;
--dim: #b8b8b8;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
margin: 0;
width: 100%;
height: 100%;
min-width: 0;
background: transparent;
}

body {
overflow: hidden;
color: var(--text);
font-family: "Crimson Text", Georgia, serif;
}

.scene-launcher {
display: flex;
flex-direction: column;
width: 100%;
max-width: 560px;
height: 100%;
min-height: 0;
margin: 0 auto;
padding: 10px;
border: 1px solid rgba(184, 134, 11, .4);
border-top: 2px solid var(--crimson);
border-radius: 6px;
background: radial-gradient(ellipse at top left, #291013, transparent 65%), var(--ink);
box-shadow: inset 0 0 24px rgba(139, 0, 0, .12);
}

.launcher-header {
flex: none;
padding: 4px 3px 12px;
margin-bottom: 8px;
border-bottom: 1px solid rgba(160, 37, 47, .5);
}

.archive-label {
margin: 0 0 7px;
color: var(--light-gold);
font: 10px/1.4 "Special Elite", monospace;
letter-spacing: .15em;
text-transform: uppercase;
}

.launcher-header h2 {
margin: 0;
color: var(--text);
font: 600 clamp(13px, 3.2vw, 17px)/1.45 "Cinzel", Georgia, serif;
letter-spacing: .055em;
text-transform: uppercase;
overflow-wrap: anywhere;
}

.scene-grid {
flex: 1;
min-height: 0;
display: grid;
grid-template-columns: minmax(0, 1fr);
align-content: start;
gap: 12px;
padding: 3px;
overflow-x: hidden;
overflow-y: auto;
scrollbar-width: thin;
scrollbar-color: var(--red) var(--ink);
-webkit-overflow-scrolling: touch;
}

.scene-grid.is-single {
align-content: stretch;
grid-template-rows: minmax(min-content, 1fr);
}

.scene-entry {
display: flex;
flex-direction: column;
min-width: 0;
}

.scene-card {
appearance: none;
display: flex;
flex: 1;
flex-direction: column;
width: 100%;
min-width: 0;
margin: 0;
padding: 0;
overflow: hidden;
border: 1px solid rgba(184, 134, 11, .42);
border-radius: 4px;
background: var(--panel);
color: var(--text);
font: inherit;
text-align: left;
cursor: pointer;
touch-action: manipulation;
-webkit-tap-highlight-color: rgba(160, 37, 47, .22);
transition: border-color .2s, box-shadow .2s;
}

.scene-card:focus-visible,
.scene-help summary:focus-visible,
.scene-link:focus-visible {
outline: 2px solid var(--light-gold);
outline-offset: 2px;
}

.scene-card:active {
border-color: var(--light-gold);
}

.scene-media {
position: relative;
display: block;
flex: none;
width: 100%;
height: 270px;
min-height: 200px;
overflow: hidden;
background: radial-gradient(ellipse at center, #2a1b1b, #090909 75%);
}

.is-single .scene-media {
flex: 1;
height: auto;
}

.scene-image {
position: absolute;
inset: 0;
display: block;
width: 100%;
height: 100%;
object-fit: contain;
object-position: center;
}

.scene-media::after {
content: "";
position: absolute;
inset: 0;
pointer-events: none;
background: linear-gradient(180deg, transparent 65%, rgba(17, 17, 17, .95));
}

.file-tag {
position: absolute;
z-index: 1;
top: 10px;
left: 10px;
padding: 6px 8px;
border: 1px solid rgba(184, 134, 11, .5);
background: rgba(8, 8, 8, .88);
color: var(--light-gold);
font: 10px/1 "Special Elite", monospace;
letter-spacing: .1em;
}

.scene-caption {
display: block;
flex: none;
padding: 10px 13px 14px;
border-bottom: 2px solid var(--crimson);
background: linear-gradient(var(--panel), #170b0d);
}

.scene-title {
display: block;
margin-bottom: 9px;
font: 600 27px/1.12 "Crimson Text", Georgia, serif;
overflow-wrap: anywhere;
}

.scene-cue {
display: block;
color: var(--light-gold);
font: 11px/1.5 "Special Elite", monospace;
}

.scene-help {
flex: none;
color: var(--dim);
}

.scene-help summary {
min-height: 44px;
padding: 12px 3px 8px;
font: 13px/1.5 Georgia, serif;
cursor: pointer;
}

.scene-help p {
margin: 8px 2px;
font-size: 16px;
line-height: 1.35;
}

.scene-link {
width: 100%;
min-width: 0;
padding: 10px;
border: 1px solid var(--red);
border-radius: 3px;
background: var(--ink);
color: var(--text);
font: 16px/1.4 Georgia, serif;
}

.widget-note {
margin: 10px;
color: var(--dim);
}

@media (min-width: 480px) {
.scene-grid:not(.is-single) {
grid-template-columns: repeat(2, minmax(0, 1fr));
}
.scene-grid:not(.is-single) .scene-title {
font-size: 23px;
}
}

@media (hover: hover) and (pointer: fine) {
.scene-card:hover {
border-color: var(--gold);
box-shadow: 0 0 14px rgba(139, 0, 0, .35), inset 0 0 0 1px rgba(184, 134, 11, .2);
}
.scene-help summary:hover {
color: var(--light-gold);
}
}

@media (prefers-reduced-motion: reduce) {
.scene-card {
transition: none;
}
}
</style>
</head>

<body>
<section class="scene-launcher" aria-labelledby="launcher-title">
<header class="launcher-header">
<p class="archive-label">Classified · Holloway Archive</p>
<h2 id="launcher-title">Other Scenes With Nathaniel</h2>
</header>

<div id="scene-grid" class="scene-grid">
<p class="widget-note">Loading the scene archive…</p>
</div>

<noscript>
<p class="widget-note">Enable JavaScript to load the scenes.</p>
</noscript>
</section>

<script>
(() => {
  // Add another object here for each additional scene.
  const scenes = [
    {
      title: "Your Professor Followed You Home",
      image: "https://i.ibb.co/m5KwMM6q/grok-video-2026-03-16-22-13-21-ezgif-com-optimize.gif",
      url: "https://www.clank.world?scene=4b441511-9bf4-4eef-8625-37daff72da36"
    }
  ];

  function initSceneLauncher() {
    const grid = document.getElementById("scene-grid");

    if (!grid) {
      console.warn("Scene launcher: missing scene-grid container.");
      return;
    }

    grid.replaceChildren();
    grid.classList.toggle("is-single", scenes.length === 1);

    scenes.forEach((scene, index) => {
      const entry = document.createElement("article");
      entry.className = "scene-entry";

      entry.innerHTML = `
        <button class="scene-card" type="button">
          <span class="scene-media">
            <img class="scene-image" alt="" decoding="async">
            <span class="file-tag" aria-hidden="true"></span>
          </span>
          <span class="scene-caption">
            <span class="scene-title"></span>
            <span class="scene-cue">Tap Image · Enter Scene ↗</span>
          </span>
        </button>
        <details class="scene-help">
          <summary>Scene didn’t open? Get the link.</summary>
          <input class="scene-link" type="text" readonly spellcheck="false">
          <p class="help-note">Tap and hold the link to copy it, then paste it into a new tab.</p>
        </details>
      `;

      const button = entry.querySelector(".scene-card");
      const image = entry.querySelector(".scene-image");
      const help = entry.querySelector(".scene-help");
      const link = entry.querySelector(".scene-link");

      entry.querySelector(".scene-title").textContent = scene.title;
      entry.querySelector(".file-tag").textContent =
        `FILE ${String(index + 1).padStart(2, "0")}`;

      button.setAttribute(
        "aria-label",
        `${scene.title} — open in a new tab`
      );

      button.title = "Open scene in a new tab";

      image.loading = index === 0 ? "eager" : "lazy";
      image.src = scene.image;

      link.value = scene.url;
      link.setAttribute(
        "aria-label",
        `Copy the link for ${scene.title}`
      );

      link.addEventListener("focus", () => link.select());
      link.addEventListener("click", () => link.select());

      button.addEventListener("click", () => {
        try {
          // Immediate request from the user's click.
          // No automatic opening or current-page redirect.
          window.open(scene.url, "_blank", "noopener,noreferrer");

          // No automatic retry: noopener can return null on success.
        } catch (error) {
          help.open = true;

          entry.querySelector(".help-note").textContent =
            "The browser refused this request. Copy the link above and paste it into a new tab.";

          console.warn("Scene launcher could not open the scene:", error);
        }
      });

      grid.append(entry);
    });

    if (!scenes.length) {
      const note = document.createElement("p");
      note.className = "widget-note";
      note.textContent = "No scenes have been added yet.";
      grid.append(note);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      initSceneLauncher,
      { once: true }
    );
  } else {
    initSceneLauncher();
  }
})();
</script>
</body>
</html>
